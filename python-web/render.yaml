services:
  - type: web
    name: aegis-landing
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: false
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
