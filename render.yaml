services:
  - type: web
    name: aegis-landing
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: false
      - key: REPO_URL
        value: https://github.com/alcides18huerto-svg/A.E.G.I.S.
    plan: free
    rootDir: .
    autoDeploy: true
    healthCheckPath: /api/health
