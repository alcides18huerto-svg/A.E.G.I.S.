services:
  # ---------------------------------------------------------------
  # 1. Dashboard interactivo (React + Vite) — Static Site
  # ---------------------------------------------------------------
  - type: web
    name: aegis-dashboard
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------------------------------------------------------------
  # 2. Landing bilingüe + API ML (Flask) — Web Service
  # ---------------------------------------------------------------
  - type: web
    name: aegis-landing
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: false
      - key: REPO_URL
        value: https://github.com/alcides18huerto-svg/A.E.G.I.S.
    plan: free
    rootDir: .
    autoDeploy: true
    healthCheckPath: /api/health
